<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registration Form — Serenity Apartment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-body">
  <div class="registration-page-container">
    <div class="registration-main-card">
      
      <div class="registration-title-badge">REGISTRATION FORM</div>

      <form class="registration-form" action="#" method="post" enctype="multipart/form-data">
        
        <div class="form-two-columns">
          <!-- LEFT COLUMN -->
          <div class="form-column left-col">
            
            <div class="form-group">
              <label for="username">Username</label>
              <input type="text" id="username" name="username" placeholder="Choose your username" required>
            </div>

            <div class="form-group">
              <label for="fullname">Tenant Full Name</label>
              <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
              <label for="id_upload">ID Submitted (Valid ID)</label>
              <input type="file" id="id_upload" name="id_upload" accept="image/*,.pdf" required>
            </div>

            <div class="form-group">
              <label for="movein">Move-In Date</label>
              <input type="date" id="movein" name="movein" required>
            </div>

            <div class="form-group">
              <label for="occupation">Occupation</label>
              <input type="text" id="occupation" name="occupation" placeholder="Your occupation / work">
            </div>

          </div>
          
          <!-- RIGHT COLUMN -->
          <div class="form-column right-col">
            
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="Create a password" required>
            </div>

            <div class="form-group">
              <label for="unit">Unit Number</label>
              <input type="text" id="unit" name="unit" placeholder="e.g. Unit 16" required>
            </div>

            <div class="form-group">
              <label for="contact">Contact Number</label>
              <input type="tel" id="contact" name="contact" placeholder="+63 XXX XXX XXXX" required>
            </div>

            <div class="form-group">
              <label for="contract">Upload Contract (PDF)</label>
              <input type="file" id="contract" name="contract" accept=".pdf" required>
            </div>

            <div class="form-group">
              <label for="leaseend">Lease End Date</label>
              <input type="date" id="leaseend" name="leaseend" required>
            </div>

            <div class="form-group">
              <label for="profile_pic">Upload Profile Picture</label>
              <input type="file" id="profile_pic" name="profile_pic" accept="image/*">
            </div>

          </div>
        </div>

        <div class="button-row">
          <button type="submit" class="submit-btn">Submit Registration</button>
          <a href="Login.html" class="back-btn">Back to Login</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
